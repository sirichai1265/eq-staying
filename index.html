<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAL Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f6; --card:#ffffff; --ink:#14233c; --muted:#5d6b7e; --line:#d7dee8;
  --navy:#123a68; --navy-h:#0d2d52; --eyebrow:#1f6fc5; --red:#d7261e; --stripe:rgba(18,58,104,.035);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3442;
    --navy:#1f4f88; --navy-h:#2a63a6; --eyebrow:#6aa8ec; --red:#f2665f; --stripe:rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202b; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3442;
  --navy:#1f4f88; --navy-h:#2a63a6; --eyebrow:#6aa8ec; --red:#f2665f; --stripe:rgba(255,255,255,.02);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.45 Roboto,"Segoe UI","Leelawadee UI",Tahoma,sans-serif;
  background:var(--bg) repeating-linear-gradient(90deg,transparent 0 46px,var(--stripe) 46px 50px)}
.mono{font-family:"Roboto Mono",Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 40px}
header{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.logo{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex}
.logo img{height:52px;width:auto;display:block}
.sep{width:1px;align-self:stretch;background:var(--line)}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:14px}
h1::before{content:"";width:5px;height:28px;background:var(--red);border-radius:2px}
.upd{margin-left:auto;text-align:right;color:var(--muted);font-size:13.5px;line-height:1.7}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:4px;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(16,35,60,.06)}
.body{padding:20px 24px 18px;flex:1}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.6px;color:var(--eyebrow);text-transform:uppercase}
h2{margin:6px 0 0;font-size:25px;font-weight:700;color:var(--navy)}
:root[data-theme="dark"] h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
.desc{color:var(--muted);font-size:12.5px;margin-top:2px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
.v.neg{color:var(--red)}
.l{font-size:13px;color:var(--muted)}
.open{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;text-decoration:none;
  font-weight:700;font-size:15px;padding:13px 24px;border-radius:0 0 3px 3px}
.open:hover{background:var(--navy-h)}
.open span{transition:transform .15s}
.open:hover span{transform:translateX(4px)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:18px}
  header{flex-wrap:wrap;gap:12px}
  .sep{display:none}
  .upd{margin-left:0;text-align:left;width:100%}
  .logo img{height:40px}
}
</style>
</head>
